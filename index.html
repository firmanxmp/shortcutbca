<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortCut Mutasi BCA - Modern Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sidebar: #0f172a;
            --bg-content: #f8fafc;
            --card-white: #ffffff;
            
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --accent: #0ea5e9;
            
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --text-light: #e2e8f0;
            
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
            
            --sidebar-width: 380px;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-content);
            color: var(--text-dark);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            box-shadow: 4px 0 24px rgba(0,0,0,0.05);
            z-index: 20;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand svg {
            color: var(--primary);
            width: 32px;
            height: 32px;
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
            color: white;
        }

        .brand span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 12px;
        }

        .input-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: none;
            transition: all 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        textarea::placeholder {
            color: #475569;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-process {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            flex: 2;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .btn-process:hover {
            opacity: 0.9;
        }

        .btn-clear {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            flex: 1;
        }

        .btn-clear:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 32px 40px;
            overflow: hidden;
            position: relative;
        }

        header.top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2.section-title {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-dark);
        }

        .badge-ready {
            background-color: #dcfce7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .badge-ready::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #16a34a;
            border-radius: 50%;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            padding: 20px 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .card-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .card-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        .card.highlight {
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            border-color: #bae6fd;
        }
        
        .card.highlight .card-value {
            color: #0284c7;
        }

        .btn-copy-wrap {
            display: flex;
            align-items: stretch;
        }

        .btn-copy {
            background-color: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-dark);
            height: 100%;
            padding: 0 32px;
            font-size: 1rem;
        }

        .btn-copy:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        
        .btn-copy svg {
            color: var(--success);
        }

        .table-wrapper {
            flex: 1;
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .table-scroll {
            overflow-y: auto;
            flex: 1;
        }
        
        .table-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f8fafc;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            text-align: left;
            padding: 16px 24px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: #334155;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .col-num { width: 60px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
        .col-name { font-weight: 500; }
        .col-amount { 
            text-align: right; 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            color: var(--success);
            background-color: rgba(16, 185, 129, 0.02);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 94%;
            color: #94a3b8;
            text-align: center;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .empty-icon-bg {
            background-color: #f1f5f9;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            margin: 0 0 8px 0;
            color: var(--text-dark);
        }
        
        .empty-state p {
            margin: 0;
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            aside { width: 100%; height: auto; padding: 24px; }
            textarea { height: 200px; }
            main { height: auto; min-height: 500px; padding: 24px; }
            .stats-container { grid-template-columns: 1fr; }
            .btn-copy-wrap { width: 100%; }
            .btn-copy { width: 100%; padding: 16px; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
            <div>
                <h1>Mutasi<span style="color:var(--primary)">Parser</span></h1>
                <span style="font-size:0.75rem; opacity:0.6;">Tools Mutasi BCA</span>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Data Mutasi (Paste Disini)</label>
            <textarea id="inputText" placeholder="Contoh:&#10;PEND 01/01/2024 ...&#10;TRSF E-BANKING DB ..."></textarea>
        </div>

        <div class="action-buttons">
            <button class="btn-process" onclick="processData()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Proses Data
            </button>
            <button class="btn-clear" onclick="clearInput()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>
    </aside>

    <main>
        <header class="top-bar">
            <h2 class="section-title">Hasil Laporan</h2>
            <div class="badge-ready">Google Sheets Ready</div>
        </header>

        <div id="dashboardStats" class="stats-container" style="display:none;">
            <div class="card">
                <span class="card-label">Total Transaksi</span>
                <div class="card-value" id="totalCount">0</div>
            </div>
            <div class="card highlight">
                <span class="card-label">Total Dana Masuk</span>
                <div class="card-value" id="totalAmount">Rp 0</div>
            </div>
            <div class="btn-copy-wrap">
                <button class="btn-copy" onclick="copyForSheets()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:8px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
                    Salin Excel
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <div class="table-scroll">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th class="col-num">No</th>
                            <th>Nama Pengirim</th>
                            <th style="text-align:right">Nominal (IDR)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Hasil Table -->
                    </tbody>
                </table>

                <div id="emptyState" class="empty-state">
                    <div class="empty-icon-bg">
                        <svg width="32" height="32" color="#94a3b8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    </div>
                    <h3>Belum ada data</h3>
                    <p>Tempel data mutasi di panel kiri lalu klik "Proses Data"</p>
                </div>
            </div>
        </div>
    </main>

<script>
    let globalData = [];

    function clearInput() {
        document.getElementById('inputText').value = '';
        document.getElementById('inputText').focus();
    }

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(angka);
    }

    function processData() {
        const input = document.getElementById('inputText').value;
        const tableBody = document.querySelector('#resultTable tbody');
        const statsDiv = document.getElementById('dashboardStats');
        const emptyState = document.getElementById('emptyState');
        const resultTable = document.getElementById('resultTable');
        
        if (!input.trim()) {
            alert("Silakan tempel data mutasi terlebih dahulu!");
            return;
        }

        const rawLines = input.split('\n');
        let blocks = [];
        let currentBlockLines = [];
        const dateRegex = /^\d{2}\/\d{2}\/\d{4}$/; 

        rawLines.forEach(lineRaw => {
            let line = lineRaw.trim();
            if (!line) return;

            const isHeader = (line === 'PEND') || dateRegex.test(line);

            if (isHeader) {
                if (currentBlockLines.length > 0) blocks.push(currentBlockLines);
                currentBlockLines = [line];
            } else {
                currentBlockLines.push(line);
            }
        });
        if (currentBlockLines.length > 0) blocks.push(currentBlockLines);

        let validTransactions = [];
        let grandTotal = 0;

        blocks.forEach(lines => {
            if (lines.length < 3) return;

            let isIncoming = false;
            let typeLine = "";
            
            for (let l of lines) {
                if (l.includes('TRSF E-BANKING') || l.includes('BI-FAST') || l.includes('SWITCHING') || l.includes('SETORAN VIA CDM')) {
                    typeLine = l;
                    break;
                }
            }
            
            if (lines.some(l => l === 'CR' || l.endsWith(' CR'))) isIncoming = true; 
            if (typeLine.includes('DB')) isIncoming = false;

            if (isIncoming) {
                let amount = 0;
                let name = "Unknown";
                
                let rawAmountIndex = lines.findIndex(l => /^\d+\.00$/.test(l));
                
                if (rawAmountIndex !== -1) {
                    amount = parseFloat(lines[rawAmountIndex]);
                } else {
                    let index0000 = lines.findIndex(l => l === '0000');
                    if (index0000 !== -1 && lines[index0000 + 1]) {
                        let potentialAmt = lines[index0000 + 1].replace(/,/g,'');
                        if (!isNaN(parseFloat(potentialAmt))) amount = parseFloat(potentialAmt);
                    }
                }

                if (typeLine.includes('SWITCHING')) {
                    let trfLine = lines.find(l => l.startsWith('TRF '));
                    if (trfLine) {
                        let match = trfLine.match(/TRF\s+(?:\d+\s+)?(.*?)(?=\s+\d{3,}|\s*$)/);
                        if (match && match[1]) {
                            name = match[1];
                        } else {
                            name = trfLine;
                        }
                    }
                }
                else if (typeLine.includes('BI-FAST')) {
                    let trsfLine = lines.find(l => l.includes('TRANSFER DR'));
                    if (trsfLine) {
                        let match = trsfLine.match(/TRANSFER DR\s+(?:\d+\s+)?(.*)/);
                        name = match && match[1] ? match[1] : trsfLine;
                    }
                }
                else if (typeLine.includes('SETORAN VIA CDM')) {
                    let cdmLine = lines.find(l => l.includes('WSID:'));
                    if (cdmLine) {
                        let parts = cdmLine.split(/WSID:[A-Z0-9]+\s+/);
                        if (parts.length > 1) name = parts[1];
                        else name = cdmLine;
                    }
                }
                else {
                    let index0000 = lines.findIndex(l => l === '0000');
                    
                    if (index0000 !== -1) {
                        let lineBefore = lines[index0000 - 1];
                        let lineTwoBefore = lines[index0000 - 2];
                        
                        if (lineBefore === 'DOMPET ANAK BANGSA' || 
                            lineBefore.includes('ESPAY') || 
                            lineBefore.includes('DANA') || 
                            lineBefore.includes('OVO') ||
                            lineBefore.includes('ALTO NETWORK')) {
                            
                            name = lineTwoBefore;
                            if (name && name.startsWith('TRFDN-')) {
                                name = name.replace('TRFDN-', '');
                            } else if (name && (name.startsWith('ID') || !isNaN(name.charAt(0)))) {
                                name = name + " (" + lineBefore + ")";
                            }
                        } else {
                            name = lineBefore;
                        }
                    } else {
                        if (rawAmountIndex !== -1 && lines[rawAmountIndex + 1]) {
                            name = lines[rawAmountIndex + 1];
                        }
                    }
                }

                if(name) name = name.trim();

                if (amount > 0) {
                    validTransactions.push({ name, amount });
                    grandTotal += amount;
                }
            }
        });

        globalData = validTransactions;

        tableBody.innerHTML = '';
        if (validTransactions.length > 0) {
            emptyState.style.display = 'none';
            resultTable.style.display = 'table';
            statsDiv.style.display = 'grid';
            
            validTransactions.forEach((trx, index) => {
                let row = `
                    <tr>
                        <td class="col-num">${index + 1}</td>
                        <td class="col-name">${trx.name}</td>
                        <td class="col-amount">${formatRupiah(trx.amount)}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            document.getElementById('totalCount').innerText = validTransactions.length;
            document.getElementById('totalAmount').innerText = formatRupiah(grandTotal);
        } else {
            emptyState.style.display = 'flex';
            statsDiv.style.display = 'none';
            resultTable.style.display = 'none';
            alert("Tidak ditemukan transaksi dana masuk yang valid.");
        }
    }

    function copyForSheets() {
        if (globalData.length === 0) {
            alert("Tidak ada data untuk disalin.");
            return;
        }

        let textToCopy = "";
        globalData.forEach(trx => {
            textToCopy += `${trx.name}\t${trx.amount}\n`;
        });

        navigator.clipboard.writeText(textToCopy).then(() => {
            const btn = document.querySelector('.btn-copy');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:8px">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Tersalin!
            `;
            btn.style.color = 'var(--success)';
            btn.style.borderColor = 'var(--success)';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 2000);
        }).catch(err => {
            alert("Gagal menyalin: " + err);
        });
    }
</script>

</body>
</html>
